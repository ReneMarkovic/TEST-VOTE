name: Sync DVK data & deploy GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: '*/2 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Prenos zadnjih podatkov DVK (Python)
        id: fetch_dvk
        continue-on-error: true
        run: python3 scripts/fetch_dvk_lv2026.py

      - name: Shrani posodobljen public/lv2026-data.json
        if: github.ref == 'refs/heads/main' && steps.fetch_dvk.outcome == 'success'
        run: |
          if ! git diff --quiet public/lv2026-data.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add public/lv2026-data.json
            git commit -m "Samodejna posodobitev podatkov DVK lv2026 [skip ci]"
            git push
          else
            echo "Podatki v public/lv2026-data.json so že najnovejši."
          fi

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi

      - name: Build site
        env:
          VITE_LIVE_USERS_ENDPOINT: ${{ vars.VITE_LIVE_USERS_ENDPOINT }}
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
